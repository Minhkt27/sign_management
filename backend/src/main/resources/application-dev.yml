spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/signage_db
    username: postgres
    password: ${POSTGRES_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: hospital-signage-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 3600000
  refresh-expiration: 604800000

app:
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@Dev#2024}
  tech-initial-password: ${TECH_INITIAL_PASSWORD:Tech@Dev#2024}
