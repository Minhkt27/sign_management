spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/signage_db
    username: postgres
    password: ${POSTGRES_PASSWORD:change_me_in_production}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

minio:
  secret-key: change_me_strong_password

jwt:
  secret: ${JWT_SECRET:change_me_in_dev_must_be_at_least_256_bits_long_for_hs256}
  expiration: 28800000
  refresh-expiration: 2592000000

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,https://*.ngrok-free.app,https://*.ngrok-free.dev

app:
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:Admin@Dev#2024}
  tech-initial-password: ${TECH_INITIAL_PASSWORD:Tech@Dev#2024}
