name: CI

"on":
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn test -B

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run

      # Test chạy qua vitest KHÔNG kiểm tra kiểu TypeScript, còn "tsc --noEmit" ở thư mục gốc
      # thì không kiểm file nào (tsconfig.json gốc có "files": [] và chỉ trỏ sang tsconfig con).
      # Thiếu bước này, code sai kiểu vẫn qua CI xanh rồi chết ở bước build trên server —
      # đã xảy ra thật (2026-09-22): 3 lỗi kiểu lọt qua, một trong số đó còn gây lỗi 400 lúc chạy.
      - name: Type check & build
        working-directory: frontend
        run: npm run build
