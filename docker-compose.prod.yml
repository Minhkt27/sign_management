# Triển khai thật trên VPS. Hướng dẫn từng bước: deploy/README.md
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Server này CHỈ chạy một dự án, nên mọi thứ nằm trong một stack: Postgres, MinIO, backend,
# frontend, Caddy (HTTPS) và sao lưu. Trước đây Postgres/MinIO/Caddy tách sang thư mục
# vps-shared để dùng chung với DocuSync — nhưng thư mục đó không nằm trong git, nên server
# mới không có cách nào lấy về, và hai file .env ở hai nơi phải tự giữ khớp mật khẩu bằng tay.
# Gộp lại thì clone một repo, tạo một .env là chạy được.
#
# Nguyên tắc cổng: chỉ Caddy mở ra ngoài (80/443). Mọi service khác KHÔNG publish cổng nào —
# chúng nói chuyện với nhau qua mạng nội bộ của Docker.
#
# Mọi service đều có restart: unless-stopped. Thiếu nó thì VPS khởi động lại (nhà cung cấp bảo
# trì, cập nhật kernel) là hệ thống tắt luôn cho tới khi có người vào gõ lệnh bật lại.

services:
  postgres:
    # File gốc gắn profile "dev" để máy dev không vô tình chạy nó. Production thì cần.
    profiles: !reset []
    restart: unless-stopped
    ports: !reset []
    environment:
      # Chỉ đọc bởi deploy/postgres-init/ lúc database khởi tạo LẦN ĐẦU (volume còn trống),
      # để tạo sẵn tài khoản "signage" cho backend. Các lần khởi động sau không dùng tới.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./scripts/init-db.sql:/opt/signage/init-db.sql:ro

  minio:
    profiles: !reset []
    restart: unless-stopped
    ports: !reset []

  backend:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Suy ra từ SITE_DOMAIN để chỉ phải khai báo tên miền MỘT lần trong .env.
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?SITE_DOMAIN is required}
      # Đường dẫn này được lưu NGUYÊN VĂN vào database cùng mỗi ảnh tải lên — đổi tên miền
      # sau này thì ảnh cũ vẫn trỏ về tên miền cũ.
      MINIO_PUBLIC_URL: https://${SITE_DOMAIN:?SITE_DOMAIN is required}/signage-assets

  frontend:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: signage_caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Chứa chứng chỉ HTTPS. Mất volume này thì Caddy phải xin lại chứng chỉ, mà Let's Encrypt
      # giới hạn số lần cấp lại cho cùng tên miền mỗi tuần.
      - caddy_data:/data
      - caddy_config:/config

  backup:
    profiles: !reset []
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-srt_db}
      TZ: Asia/Ho_Chi_Minh
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - minio_data:/minio-data:ro
      - ./deploy/backup:/opt/backup:ro
      - ./.env:/opt/signage.env:ro
    # Thay lịch của file gốc (mỗi Chủ nhật, chỉ database) bằng: mỗi đêm 02:00 giờ Việt Nam,
    # cả database lẫn ảnh. Chi tiết trong deploy/backup/backup.sh.
    entrypoint:
      - sh
      - -c
      - |
        echo "0 2 * * * sh /opt/backup/backup.sh >> /backups/backup.log 2>&1" > /etc/crontabs/root
        exec crond -f -l 8

volumes:
  caddy_data:
  caddy_config:
