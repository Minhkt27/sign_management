services:
  # Chỉ dùng cho dev cục bộ — bật bằng: docker compose --profile dev up -d
  # Trên production (docker-compose.prod.yml), Postgres dùng chung do repo vps-shared quản lý,
  # không chạy Postgres riêng ở đây nữa (tránh chạy dư + lộ cổng 5432 ra ngoài không cần thiết).
  postgres:
    image: postgres:15-alpine
    container_name: signage_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srt_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["dev"]

  # Chỉ dùng cho dev cục bộ — bật bằng: docker compose --profile dev up -d
  # Trên production (docker-compose.prod.yml), MinIO dùng chung do repo vps-shared quản lý,
  # không chạy MinIO riêng ở đây nữa (tránh chạy dư + lộ cổng 9000/9001 ra ngoài không cần thiết).
  minio:
    image: minio/minio:latest
    container_name: signage_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["dev"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signage_backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-srt_db}?currentSchema=sign_management
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-signage-assets}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/signage-assets}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required}
      TECH_INITIAL_PASSWORD: ${TECH_INITIAL_PASSWORD:?TECH_INITIAL_PASSWORD is required}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD:?SUPERADMIN_INITIAL_PASSWORD is required}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signage_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  # Chỉ dùng cho dev cục bộ (sao lưu Postgres cục bộ ở trên) — bật cùng profile "dev".
  # Trên production, backup cho Postgres dùng chung là việc của repo vps-shared, không phải ở đây.
  backup:
    image: postgres:15-alpine
    container_name: signage_backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "
        echo '0 2 * * 0 pg_dump -h postgres -U $${POSTGRES_USER:-postgres} $${POSTGRES_DB:-srt_db} | gzip > /backups/backup_$$(date +\\%Y\\%m\\%d).sql.gz && ls -t /backups/*.sql.gz | tail -n +5 | xargs rm -f' > /etc/crontabs/root &&
        crond -f
      "
    restart: unless-stopped
    profiles: ["dev"]

volumes:
  postgres_data:
  minio_data:
